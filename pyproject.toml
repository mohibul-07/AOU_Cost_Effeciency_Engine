[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aou-cost-engine"
version = "0.1.0"
description = "Cost estimation engine for All of Us Research Workbench — dry-run-first BigQuery cost preview, guardrails, and AI-powered query optimization."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mohibul", email = "alammohibul07@gmail.com" }]
keywords = ["allofus", "bigquery", "cost-estimation", "jupyter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "google-cloud-bigquery>=3.0",
    "sqlglot>=20.0",
    "anthropic>=0.39",
    "ipython>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aou_cost_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
